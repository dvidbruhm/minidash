{{define "content"}}
<div x-data="settings()" x-init="init()">
  <div class="topbar">
    <h1>Settings</h1>
    <div class="controls">
      <a href="/" class="btn">&larr; Dashboard</a>
      <form method="post" action="/logout"><button class="btn" type="submit">Log out</button></form>
    </div>
  </div>

  <section>
    <h2>General</h2>
    <label>Title <input x-model="cfg.title"></label>
    <label>Default theme
      <select x-model="cfg.default_theme">{{range .Themes}}<option value="{{.}}">{{.}}</option>{{end}}</select>
    </label>
    <label>Default view
      <select x-model="cfg.default_view">
        <option value="default">default</option><option value="compact">compact</option>
        <option value="card">card</option><option value="large">large</option>
      </select>
    </label>
    <label>Health enabled <input type="checkbox" x-model="cfg.health.enabled"></label>
    <label>Interval (s) <input type="number" x-model.number="cfg.health.interval_seconds"></label>
    <label>Timeout (s) <input type="number" x-model.number="cfg.health.timeout_seconds"></label>
    <button class="btn primary" @click="saveGeneral()">Save general</button>
  </section>

  <section>
    <h2>Appearance</h2>
    <div class="grid2">
      <label>Max width <input type="number" x-model.number="cfg.appearance.page.max_width"></label>
      <label>Background <input x-model="cfg.appearance.page.background" placeholder="#hex or empty"></label>
      <label>Font family <select x-model="cfg.appearance.page.font_family"><option>system</option><option>sans</option><option>serif</option><option>mono</option></select></label>
      <label>Font size <input type="number" x-model.number="cfg.appearance.page.font_size"></label>
      <label>Columns (auto or N) <input x-model="cfg.appearance.grid.columns"></label>
      <label>Min item width <input type="number" x-model.number="cfg.appearance.grid.min_item_width"></label>
      <label>Gap <input type="number" x-model.number="cfg.appearance.grid.gap"></label>
      <label>Corner radius <input type="number" x-model.number="cfg.appearance.item.corner_radius"></label>
      <label>Padding <input type="number" x-model.number="cfg.appearance.item.padding"></label>
      <label>Item background <input type="checkbox" x-model="cfg.appearance.item.background"></label>
      <label>Border <input type="checkbox" x-model="cfg.appearance.item.border"></label>
      <label>Border strength <input type="number" x-model.number="cfg.appearance.item.border_strength"></label>
      <label>Shadow <input type="checkbox" x-model="cfg.appearance.item.shadow"></label>
      <label>Shadow strength <input type="number" x-model.number="cfg.appearance.item.shadow_strength"></label>
      <label>Icon default <input type="number" x-model.number="cfg.appearance.icon.size_default"></label>
      <label>Icon compact <input type="number" x-model.number="cfg.appearance.icon.size_compact"></label>
      <label>Icon card <input type="number" x-model.number="cfg.appearance.icon.size_card"></label>
      <label>Icon large <input type="number" x-model.number="cfg.appearance.icon.size_large"></label>
      <label>Text align <select x-model="cfg.appearance.text.align"><option>left</option><option>center</option></select></label>
      <label>Show description <input type="checkbox" x-model="cfg.appearance.text.show_description"></label>
      <label>Status dot enabled <input type="checkbox" x-model="cfg.appearance.status_dot.enabled"></label>
      <label>Status dot size <input type="number" x-model.number="cfg.appearance.status_dot.size"></label>
      <label>Status dot position <select x-model="cfg.appearance.status_dot.position"><option>bottom-right</option><option>top-right</option></select></label>
    </div>
    <button class="btn primary" @click="saveAppearance()">Save appearance</button>
  </section>

  <section>
    <h2>Sections</h2>
    <ul id="sections-list">
      <template x-for="(sec, idx) in cfg.sections" :key="sec.id">
        <li :data-id="sec.id"><input x-model="sec.name" @change="saveSection(sec)"><button @click="deleteSection(idx)">x</button></li>
      </template>
    </ul>
    <button class="btn" @click="addSection()">+ Add section</button>
  </section>

  <section>
    <h2>Links</h2>
    <button class="btn primary" @click="openModal(null)">+ Add link</button>
    <template x-for="g in groupedLinks()" :key="g.id||'_'">
      <div style="margin-top:12px">
        <h3 x-text="g.name || 'Unsectioned'"></h3>
        <ul class="links-list" :data-section="g.id">
          <template x-for="link in g.links" :key="link._id">
            <li :data-id="link._id">
              <span class="drag">&#8942;&#8942;</span>
              <span class="preview" x-html="iconHTML(link.icon)"></span>
              <a x-text="link.name" :href="link.url" target="_blank"></a>
              <code x-text="link.url"></code>
              <button @click="openModal(link)">Edit</button>
              <button @click="duplicateLink(link)">Duplicate</button>
              <button @click="deleteLink(link)">Delete</button>
            </li>
          </template>
        </ul>
      </div>
    </template>
  </section>

  <div class="modal" x-show="modal.open" x-cloak @keydown.escape.window="modal.open=false">
    <div class="modal-card">
      <h3 x-text="modal.link && modal.link._id!=null ? 'Edit link' : 'Add link'"></h3>
      <label>Name <input x-model="modal.link.name"></label>
      <label>Description <input x-model="modal.link.description"></label>
      <label>URL <input x-model="modal.link.url"></label>
      <label>Color <input type="color" x-model="modal.link.color"><input x-model="modal.link.color"></label>
      <label>Section
        <select x-model="modal.link.section">
          <option value="">(none)</option>
          <template x-for="sec in cfg.sections" :key="sec.id"><option :value="sec.id" x-text="sec.name"></option></template>
        </select>
      </label>
      <label>Icon</label>
      <div class="picker">
        <input placeholder="search icons" x-model="picker.q" @input="searchIcons()">
        <div class="chips">
          <button @click="picker.prefix='';searchIcons()" :class="{on:picker.prefix===''}">All</button>
          <template x-for="p in iconPacks" :key="p"><button @click="picker.prefix=p;searchIcons()" :class="{on:picker.prefix===p}" x-text="p"></button></template>
        </div>
        <div class="results">
          <template x-for="res in picker.results" :key="res.prefix+':'+res.name">
            <button class="res" :style="'color:'+(modal.link.color||'#888')" @click="pickIcon(res.prefix+':'+res.name)" :title="res.prefix+':'+res.name" x-html="res.svg"></button>
          </template>
        </div>
      </div>
      <div class="actions">
        <button class="btn" @click="modal.open=false">Cancel</button>
        <button class="btn primary" @click="saveLink()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>window.__MINIDASH_CONFIG = {{.Config}}; window.__MINIDASH_PACKS = {{json .IconPacks}};</script>
<script src="/static/vendor/sortable.min.js"></script>
<script src="/static/js/settings.js"></script>
{{end}}
